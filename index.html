<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ایموجی کوئیز</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- صفحه اصلی -->

<section id="home" class="screen active">

<div class="coins">🪙 <span id="coinCount">270</span></div>

<h1>ایموجی کوئیز</h1>

<p>بازی حدس کلمه با ایموجی‌ها</p>

<button id="startBtn">شروع بازی</button>

<div class="bottomBtns">

<button>راهنمای بازی</button>

<button>فروشگاه</button>

</div>

</section>

<!-- فصل ها -->

<section id="chapters" class="screen">

<h2>فصل‌های بازی</h2>

<div class="chapterGrid">

<div class="chapter unlocked" data-chapter="1">فصل ۱</div>

<div class="chapter locked">فصل ۲</div>

<div class="chapter locked">فصل ۳</div>

<div class="chapter locked">فصل ۴</div>

</div>

</section>

<!-- مراحل -->

<section id="levels" class="screen">

<h2>فصل ۱</h2>

<div id="levelGrid" class="levelGrid"></div>

</section>

<!-- بازی -->

<section id="game" class="screen">

<div class="topBar">

<div>🪙 <span id="gameCoins">270</span></div>

<div id="stageTitle">مرحله ۱</div>

</div>

<div id="emojiBox" class="emojiBox"></div>

<div id="answerBoxes" class="answerBoxes"></div>

<div class="helpRow">

<button id="firstHint">حرف اول</button>

<button id="removeHint">حذف اضافی</button>

<button id="showAnswer">نمایش جواب</button>

</div>

<div id="letters" class="letters"></div>

</section>

<!-- برد -->

<div id="winPopup" class="popup hidden">

<div class="popupCard">

<h2>🎉 آفرین!</h2>

<p>پاسخ درست بود.</p>

<p id="correctAnswer"></p>

<p>+۱۵ سکه</p>

<button id="nextLevel">مرحله بعدی</button>

</div>

</div>

<script src="script.js"></script>

</body>
    </html>
