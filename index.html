<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ایموجو</title>
    <link rel="stylesheet" href="style.css">
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- صفحه اصلی (منو) -->
    <div id="main-menu" class="screen active">
        <div class="top-bar">
            <div class="coin-display"><span id="menu-coins">270</span> <span class="coin-icon">🪙</span></div>
        </div>
        <div class="menu-content">
            <div class="logo-area">
                <span class="emoji-logo">🕵️‍♂️🔍🧩</span>
                <h1>ایموجو</h1>
                <p>بازی حدس کلمه با ایموجی‌ها</p>
            </div>
            <button id="btn-start" class="btn-primary">شروع بازی</button>
            <div class="menu-buttons">
                <button class="btn-secondary">راهنمای بازی ⓘ</button>
                <button class="btn-secondary">فروشگاه سکه 🛒</button>
            </div>
        </div>
    </div>

    <!-- صفحه انتخاب فصل -->
    <div id="chapters-screen" class="screen">
        <div class="header">
            <h2>فصل‌های بازی</h2>
            <button class="btn-back" onclick="showScreen('main-menu')">➔</button>
        </div>
        <div class="chapters-grid" id="chapters-grid">
            <!-- فصل‌ها با جاوااسکریپت ساخته می‌شوند -->
        </div>
    </div>

    <!-- صفحه انتخاب مرحله -->
    <div id="levels-screen" class="screen">
        <div class="header">
            <button class="btn-back" onclick="showScreen('chapters-screen')">➔</button>
            <h2 id="level-header-title">فصل ۱ - مراحل</h2>
        </div>
        <div class="progress-bar-container">
            <span id="progress-text">پیشرفت کل: 0 از 25</span>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="levels-grid" id="levels-grid">
            <!-- مراحل با جاوااسکریپت ساخته می‌شوند -->
        </div>
    </div>

    <!-- صفحه بازی -->
    <div id="game-screen" class="screen">
        <div class="header">
            <button class="btn-back" onclick="showScreen('levels-screen')">➔</button>
            <div class="level-title">
                <span id="game-chapter">فصل 1</span>
                <span id="game-level">مرحله 1</span>
            </div>
            <div class="coin-display"><span id="game-coins">270</span> <span class="coin-icon">🪙</span></div>
        </div>

        <div class="game-board">
            <div class="emoji-question" id="emoji-question">
                <!-- ایموجی‌ها اینجا قرار می‌گیرند -->
            </div>
            
            <div class="hints-row">
                <button class="btn-hint" onclick="buyHint('remove')"><span>حذف اضافی</span><span class="cost">65 🪙</span></button>
                <button class="btn-hint" onclick="buyHint('letter')"><span>حرف اول</span><span class="cost">45 🪙</span></button>
                <button class="btn-hint" onclick="buyHint('reveal')"><span>نمایش جواب</span><span class="cost">130 🪙</span></button>
            </div>

            <div class="answer-slots" id="answer-slots">
                <!-- جای خالی حروف -->
            </div>
        </div>

        <div class="keyboard" id="keyboard">
            <!-- کیبورد با جاوااسکریپت ساخته می‌شود -->
        </div>
    </div>

    <!-- مودال برنده شدن -->
    <div id="win-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>آفرین! درست حدس زدی</h2>
            <p>پاسخ صحیح: <strong id="correct-answer-text"></strong></p>
            <div class="reward">+15 سکه جایزه 🪙</div>
            <button class="btn-primary" onclick="nextLevel()">مرحله بعدی ➔</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
