<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی ایموجو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-menu" class="screen active">
        <div class="top-bar">
            <div class="coin-display"><span class="coin-icon">🪙</span> <span id="menu-coins">270</span></div>
        </div>
        <div class="menu-content">
            <div class="logo-area">
                <div class="logo-emojis">
                    <span>🕵️</span><span>🔍</span><span>🧩</span>
                </div>
                <h1>ایموجو</h1>
                <p>بازی حدس کلمه با ایموجی‌ها</p>
            </div>
            <button id="btn-start" class="btn-primary">شروع بازی</button>
            <div class="menu-buttons">
                <button class="btn-secondary">راهنمای بازی <span class="icon">ⓘ</span></button>
                <button class="btn-secondary">فروشگاه سکه <span class="icon">🛒</span></button>
            </div>
        </div>
    </div>

    <div id="chapters-screen" class="screen">
        <div class="header">
            <h2>فصل‌های بازی</h2>
            <button class="btn-back" onclick="showScreen('main-menu')">➔</button>
        </div>
        <div class="chapters-grid" id="chapters-grid"></div>
    </div>

    <div id="levels-screen" class="screen">
        <div class="header">
            <button class="btn-back" onclick="showScreen('chapters-screen')">➔</button>
            <h2 id="level-header-title">فصل ۱ - مراحل</h2>
        </div>
        <div class="progress-container">
            <div class="progress-text">
                <span>پیشرفت کل:</span>
                <span id="progress-text">5 از 25 مرحله حل شده</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-header">
            <button class="btn-back" onclick="showScreen('levels-screen')">➔</button>
            <div class="level-info">
                <span id="game-chapter">فصل 1</span>
                <span id="game-level">مرحله 1</span>
            </div>
            <div class="coin-display"><span class="coin-icon">🪙</span> <span id="game-coins">270</span></div>
        </div>

        <div class="game-main">
            <div class="emoji-board" id="emoji-question"></div>
            
            <div class="hints-row">
                <button class="btn-hint" onclick="buyHint('reveal')">
                    <span>نمایش جواب</span>
                    <span class="cost">130 🪙</span>
                </button>
                <button class="btn-hint" onclick="buyHint('remove')">
                    <span>حذف اضافی</span>
                    <span class="cost">65 🪙</span>
                </button>
                <button class="btn-hint" onclick="buyHint('letter')">
                    <span>حرف اول</span>
                    <span class="cost">45 🪙</span>
                </button>
            </div>

            <div class="answer-slots" id="answer-slots"></div>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <div id="win-modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>آفرین! درست حدس زدی</h2>
            <p class="modal-subtitle">پاسخ صحیح:</p>
            <div class="correct-answer" id="correct-answer-text"></div>
            <div class="reward">+15 سکه جایزه 🪙</div>
            <button class="btn-primary" onclick="nextLevel()">مرحله بعدی ➔</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
